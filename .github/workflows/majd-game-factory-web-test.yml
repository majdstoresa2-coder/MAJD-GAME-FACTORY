name: MAJD Game Factory Web Test

on:
  workflow_dispatch:
    inputs:
      owner_command:
        description: 'أمر المالك (Owner Command)'
        required: false
        default: 'أنشئ لعبة حقيقية كاملة 3D'

jobs:
  web-build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      MAJD_PLATFORM_API_ENDPOINT: ${{ secrets.MAJD_PLATFORM_API_ENDPOINT }}
      MAJD_PLATFORM_API_TOKEN: ${{ secrets.MAJD_PLATFORM_API_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install numpy openai requests

      - name: Execute MAJD Full Factory Runtime (05)
        run: python MAJD-FULL-EXECUTION-RUNTIME-05.py "${{ github.event.inputs.owner_command }}"

      - name: Upload Playable Game Artifact
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: majd-game-final-output
          path: |
            majd_game_output/
            majd_factory_state/runtime/
